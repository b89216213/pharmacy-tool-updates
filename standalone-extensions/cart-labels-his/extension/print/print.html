<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>院內列印（Chrome）</title>
<link rel="stylesheet" href="print.css">
<link rel="stylesheet" href="../managed-ui.css"></head><body><div id="managed-workspace" inert>
<header class="bar">
  <strong>🖨 院內列印（Chrome）</strong>
  <span id="info"></span>
  <span class="grow"></span>
  <label><input type="checkbox" id="autoPrint"> 開啟時自動跳出列印</label>
  <button id="printBtn" class="primary">列印</button>
</header>
<div id="warn" class="warn" hidden></div>
<main id="pages"></main>
<details id="diagBox" class="diag"><summary>版面資料（排查用）</summary><pre id="diag"></pre></details>


</div><script type="module" src="../managed-launch.js"></script></body></html>
