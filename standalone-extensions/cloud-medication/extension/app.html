  /* ── legacy dark-mode bridge ────────────────────────────────────────────────
     Views not yet migrated to tokens (時間軸 / 表格) still carry
     hard-coded hex in their inline styles. These substring rules remap that
     hex onto the same token palette, so old and new surfaces agree. Anything
     written as var(--…) is skipped here and themes itself.               */
  body.dark #root { color: var(--fg); }

  /* Hex color overrides */
  body.dark [style*="background: #fff"], body.dark [style*="background:#fff"],
  body.dark [style*="background: white"] { background: var(--surface) !important; }
  body.dark [style*="background: #fafafa"], body.dark [style*="background:#fafafa"] { background: var(--surface-2) !important; }
  body.dark [style*="background: #f5f5f5"], body.dark [style*="background:#f5f5f5"] { background: var(--surface-2) !important; }
  body.dark [style*="background: #fff8e6"] { background: var(--warn-soft) !important; }
  body.dark [style*="background: #fffbe8"] { background: var(--warn-soft) !important; }
  body.dark [style*="background: #fff5d6"] { background: var(--warn-soft) !important; }
  body.dark [style*="background: #fff3e0"] { background: var(--warn-soft) !important; }
  body.dark [style*="background: #f0f0f0"] { background: var(--surface-3) !important; }
  body.dark [style*="background: #fdf6ec"] { background: var(--warn-soft) !important; }
  body.dark [style*="background: #111"] { background: var(--invert-bg) !important; }

  /* Also cover rgb() serialization for white/light backgrounds */
  body.dark [style*="background: rgb(255, 255, 255)"] { background: var(--surface) !important; }
  body.dark [style*="background: rgb(250, 250, 250)"] { background: var(--surface-2) !important; }
  body.dark [style*="background: rgb(245, 245, 245)"] { background: var(--surface-2) !important; }
  body.dark [style*="background: rgb(255, 248, 230)"] { background: var(--warn-soft) !important; }
  body.dark [style*="background: rgb(255, 251, 232)"] { background: var(--warn-soft) !important; }
  body.dark [style*="background: rgb(255, 245, 214)"] { background: var(--warn-soft) !important; }
  body.dark [style*="background: rgb(255, 243, 224)"] { background: var(--warn-soft) !important; }
  body.dark [style*="background: rgb(17, 17, 17)"] { background: var(--invert-bg) !important; }

  /* Text color — force light text on dark bg for any hardcoded dark text */
  body.dark [style*="color: #111"], body.dark [style*="color:#111"],
  body.dark [style*="color: rgb(17, 17, 17)"] { color: var(--fg) !important; }
  body.dark [style*="color: #222"], body.dark [style*="color: rgb(34, 34, 34)"] { color: var(--fg) !important; }
  body.dark [style*="color: #333"], body.dark [style*="color: rgb(51, 51, 51)"] { color: var(--fg-soft) !important; }
  body.dark [style*="color: #444"], body.dark [style*="color: rgb(68, 68, 68)"] { color: var(--fg-soft) !important; }
  body.dark [style*="color: #555"], body.dark [style*="color: rgb(85, 85, 85)"] { color: var(--fg-soft) !important; }
  body.dark [style*="color: #666"], body.dark [style*="color: rgb(102, 102, 102)"] { color: var(--fg-muted) !important; }
  body.dark [style*="color: #777"], body.dark [style*="color: rgb(119, 119, 119)"] { color: var(--fg-muted) !important; }
  body.dark [style*="color: #888"], body.dark [style*="color: rgb(136, 136, 136)"] { color: var(--fg-muted) !important; }
  body.dark [style*="color: #999"], body.dark [style*="color: rgb(153, 153, 153)"] { color: #7d99a8 !important; }
  body.dark [style*="color: #aaa"], body.dark [style*="color: rgb(170, 170, 170)"] { color: #6d8896 !important; }
  body.dark [style*="color: #bbb"], body.dark [style*="color: rgb(187, 187, 187)"] { color: #5e7885 !important; }

  /* Bar label colors — the timeline bars use specific dark colors like #2a4a70, #8a4a00 */
  body.dark [style*="color: #2a4a70"], body.dark [style*="color: rgb(42, 74, 112)"] { color: var(--accent) !important; }
  body.dark [style*="color: #8a4a00"], body.dark [style*="color: rgb(138, 74, 0)"] { color: var(--warn) !important; }
  body.dark [style*="color: #2a6e2a"], body.dark [style*="color: rgb(42, 110, 42)"] { color: var(--ok) !important; }
  body.dark [style*="color: #c00"], body.dark [style*="color: rgb(204, 0, 0)"] { color: var(--danger) !important; }

  /* Borders */
  body.dark [style*="border: 1px solid #ccc"] { border-color: var(--line-strong) !important; }
  body.dark [style*="border: 1px solid #ddd"] { border-color: var(--line) !important; }

  body.dark [style*="border-bottom: 2px solid #111"] { border-bottom-color: var(--line-strong) !important; }

  /* Form elements */
  body.dark textarea { background: var(--surface-2) !important; color: var(--fg) !important; border-color: var(--line) !important; }
  body.dark select, body.dark input { background: var(--surface-2) !important; color: var(--fg) !important; border-color: var(--line) !important; }

  /* Buttons — generic and specific overrides */
  body.dark button { color: var(--fg); }
  body.dark button[style*="background: #111"],
  body.dark button[style*="background: rgb(17, 17, 17)"] { background: var(--invert-bg) !important; color: var(--invert-fg) !important; }

  body.dark button[style*="background: rgb(255, 255, 255)"] { background: var(--surface-2) !important; color: var(--fg) !important; }

/* 藥物辨識 */
.pid-src{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;color:var(--fg)}
.pid-src-head{width:100%;text-align:left;background:transparent!important;border:0!important;color:var(--fg)!important;font-weight:700;font-size:14px;padding:10px 14px!important;cursor:pointer}
.pid-src-body{padding:0 14px 12px}
.pid-src .page-load-msg{color:var(--fg-muted)}.pid-src .page-load-msg.is-bad{color:var(--danger)}.pid-src .handoff-chip{color:var(--ok)}
.pid-result{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--fg)}
.pid-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.pid-title{font-weight:700;font-size:16px}.pid-title small{font-weight:400;font-size:13px;color:var(--fg-muted);margin-left:10px}
.pid-ctl{font-size:13px;color:var(--fg-soft)}.pid-ctl select,.pid-q{font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface-2);color:var(--fg);min-height:32px}
.pid-q{min-width:200px}
.pid-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(230px,calc(var(--pid-h,182px) * 1.3)),1fr));gap:10px}
.pid-card{border:1px solid var(--line);border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column}
.pid-card.is-out{opacity:.72}
.pid-img{height:var(--pid-h,182px);display:flex;align-items:center;justify-content:center;background:#fff;border-bottom:1px solid var(--line);border-radius:10px 10px 0 0}
.pid-img a{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.pid-img img{max-width:92%;max-height:calc(var(--pid-h,182px) - 10px);object-fit:contain;position:relative;transition:transform .15s ease,box-shadow .15s ease}
.pid-img img:hover{transform:scale(var(--pid-zoom,2));z-index:30;background:#fff;border-radius:6px;box-shadow:0 10px 36px rgba(0,0,0,.45)}
.pid-size{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px;color:var(--fg-soft)}
.pid-size button{border:1px solid var(--line-strong);background:var(--surface-2);color:var(--fg-soft);border-radius:6px;padding:2px 9px;min-height:30px;font-size:13px}
.pid-size button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.pid-size input{width:64px;font:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface-2);color:var(--fg)}
.pid-noimg{color:#888;font-size:13px}
.pid-body{padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.pid-zh{font-size:15px;font-weight:700;color:var(--fg)}.pid-en{font-weight:700;color:var(--accent)}.pid-ing{color:var(--fg-soft)}.pid-look{color:var(--warn)}
.pid-use{color:var(--fg-soft);margin-top:3px;font-family:var(--mono);font-size:12.5px}.pid-st{margin-left:6px;color:var(--ok);font-weight:700;font-family:var(--sans)}.is-out .pid-st{color:var(--fg-muted)}
.pid-links{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:5px}.pid-links a{color:var(--accent);font-weight:700}.pid-lic{color:var(--fg-muted);font-size:12px}
.pid-sources{margin-top:14px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:13px;color:var(--fg-soft)}
.pid-sources-title{font-weight:700;color:var(--fg);margin-bottom:4px}.pid-sources ul{margin:0;padding-left:20px;line-height:1.7}.pid-sources b{color:var(--fg)}.pid-sources a{color:var(--accent)}
.pid-db{margin-top:4px;color:var(--fg-muted)}
.pid-how{color:var(--fg-muted);font-size:12.5px;line-height:1.5;margin-bottom:2px}
/* 讀取目前頁面 */
.page-loader{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:10px 0 12px}
.page-load-btn{border-color:var(--accent)!important;color:var(--accent)!important;font-weight:700}
.page-load-btn.is-auto{background:var(--accent-bright)!important;border-color:var(--accent-bright)!important;color:#071e30!important}
.page-load-msg{font-size:13px;color:var(--invert-muted);line-height:1.5}.page-load-msg.is-bad{color:#ffb4a8}
.disclosure .page-load-msg{color:var(--fg-muted)}.disclosure .page-load-msg.is-bad{color:var(--danger)}
.handoff-chip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:6px;font-size:13px;color:#83d5a3}
.disclosure .handoff-chip{color:var(--ok)}
.discharge-sheet .ad-use{width:23%}.discharge-sheet .ad-src{width:11%}.discharge-sheet .ad-drug{width:25%}
.ad-zh{font-size:17px;font-weight:700}
.ad-en{font-weight:600}
.ad-ing,.ad-look,.ad-meta,.ad-code{font-size:13px;color:#555}
.ad-meta.is-out{color:#a15c00}
.ad-tag{display:inline-block;margin-top:3px;font-size:12px;color:#1b5e7a;border:1px solid #9cc7d8;border-radius:3px;padding:0 5px}
.ad-use{width:19%}
.ad-use-main{font-size:17px;font-weight:700}
.ad-use-freq{font-size:15px}
.ad-src{width:14%;font-size:13px}
.ad-check{font-size:14px}
.ad-print-boxes{display:none}
.ad-choices{display:flex;flex-wrap:wrap;gap:4px}
.ad-choice{border:1px solid #9aa9b2;background:#fff;color:#222;border-radius:5px;padding:3px 8px;font-size:13px;min-height:30px}
.ad-choice.on{background:#007c9d;border-color:#007c9d;color:#fff;font-weight:700}
.ad-brought{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:13px}
.ad-note{display:block;width:100%;margin-top:6px;font:inherit;font-size:13px;padding:4px 6px;border:1px solid #9aa9b2;border-radius:5px;background:#fff;color:#111}
body .admit-sheet .ad-choice{color:#222;background:#fff}body .admit-sheet .ad-choice.on{color:#fff;background:#007c9d}
body.dark .admit-sheet .ad-note{background:#fff!important;color:#111!important;border-color:#9aa9b2!important}
body.dark .admit-sheet input[type=checkbox]{background:#fff!important}
.ad-extra{margin-top:16px}
.ad-extra-title{font-weight:700;font-size:14px;margin-bottom:6px}
.ad-line{border-bottom:1px solid #777;height:30px}
.ad-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:18px;font-size:12px;color:#444}
.ad-empty{padding:24px;text-align:center;color:#666}
@media(max-width:760px){.admit-sheet{padding:16px 12px;overflow-x:auto}.ad-table{min-width:720px}}
@media print{
  @page{size:A4;margin:10mm}
  html,body{background:#fff!important}
  .app-shell.admit-open{zoom:1!important;padding:0!important;max-width:none!important}
  .admit-layer{padding:0}
  .admit-sheet{box-shadow:none;border-radius:0;padding:0;max-width:none;font-size:11pt;overflow:visible}
  .ad-table{min-width:0;width:99.6%}
  .ad-print-boxes{display:block}
  .ad-row,.ad-group{break-inside:avoid}
  .ad-group{break-after:avoid}
  .ad-table thead{display:table-header-group}
  .admit-sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* Preserve navy text on the light help button in either theme. */
.header-tools .help-pill,body.dark .header-tools .help-pill,
.header-tools .help-pill span,body.dark .header-tools .help-pill span{color:#071e30!important}
</style>
